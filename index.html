<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikelquiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --sage:#eaf2e0;
    --sage-deep:#3f6c51;
    --sage-mid:#7fa876;
    --barn:#e2963a;
    --barn-deep:#b96f21;
    --cream:#fffdf6;
    --ink:#2b3a2f;
    --error:#c1523b;
    --line:#d6e3c9;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--sage);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(127,168,118,0.18) 0, transparent 40%),
      radial-gradient(circle at 92% 88%, rgba(226,150,58,0.14) 0, transparent 45%);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 28px 16px 60px;
  }

  .app{ width:100%; max-width: 560px; }

  header{ text-align:left; margin-bottom: 22px; }
  header .kicker{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    color: var(--sage-deep);
    letter-spacing: 0.02em;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: 34px;
    line-height:1.05;
    margin: 4px 0 6px;
    color: var(--sage-deep);
  }
  header p{ margin:0; font-size:15px; color:#5a6b57; max-width: 46ch; }

  nav.tabs{
    display:flex;
    gap:8px;
    margin: 22px 0 18px;
    background: rgba(255,255,255,0.5);
    padding:5px;
    border-radius: 14px;
    border: 1px solid var(--line);
  }
  nav.tabs button{
    flex:1;
    border:none;
    background:transparent;
    padding: 10px 8px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size: 14px;
    color: #5a6b57;
    border-radius: 10px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }
  nav.tabs button.active{
    background: var(--sage-deep);
    color: var(--cream);
  }

  .card{
    background: var(--cream);
    border-radius: 20px;
    border: 1px solid var(--line);
    padding: 28px 24px;
    box-shadow: 0 1px 0 rgba(63,108,81,0.05);
  }

  .score-row{
    display:flex;
    justify-content: space-between;
    align-items:baseline;
    margin-bottom: 18px;
    font-size: 13px;
    color: #5a6b57;
  }
  .score-row .score{
    font-family:'Baloo 2', sans-serif;
    font-size: 20px;
    color: var(--barn-deep);
    font-weight:700;
  }

  .stage{
    text-align:center;
    padding: 18px 0 10px;
  }
  .emoji{
    font-size: 88px;
    line-height:1;
    display:inline-block;
    filter: drop-shadow(0 6px 10px rgba(63,108,81,0.18));
  }

  .hint-line{
    margin: 18px 0 4px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 26px;
    letter-spacing: 0.06em;
    color: var(--sage-deep);
    min-height: 34px;
  }
  .hint-line .gap{ opacity: 0.35; }

  form.answer-row{
    display:flex;
    gap:8px;
    margin-top: 16px;
  }
  input[type=text]{
    flex:1;
    min-width: 0;
    padding: 13px 14px;
    border-radius: 12px;
    border: 2px solid var(--line);
    font-family:'Inter',sans-serif;
    font-size: 16px;
    background: #fff;
    color: var(--ink);
    outline:none;
    transition: border-color .15s ease;
  }
  input[type=text]:focus{ border-color: var(--sage-mid); }
  input[type=text].wrong{ border-color: var(--error); }
  input[type=text].right{ border-color: var(--sage-deep); }

  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size: 15px;
    border:none;
    border-radius: 12px;
    padding: 13px 18px;
    cursor:pointer;
    transition: transform .08s ease, filter .12s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--sage-deep); color:#fff; }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-ghost{
    background: transparent;
    border: 2px solid var(--barn);
    color: var(--barn-deep);
  }
  .btn-ghost:hover{ background: rgba(226,150,58,0.1); }
  .btn:disabled{ opacity:0.45; cursor:default; }

  .row-actions{
    display:flex;
    gap:10px;
    margin-top: 14px;
    justify-content: center;
  }

  .feedback{
    margin-top: 14px;
    min-height: 24px;
    font-weight:600;
    font-size: 14px;
    text-align:center;
  }
  .feedback.good{ color: var(--sage-deep); }
  .feedback.bad{ color: var(--error); }

  .progress-dots{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--line);
  }
  .dot.done{ background: var(--sage-mid); }
  .dot.current{ background: var(--barn); }

  .summary{ text-align:center; }
  .summary .big{
    font-family:'Baloo 2', sans-serif;
    font-size: 46px;
    color: var(--barn-deep);
    margin: 6px 0 2px;
  }
  .summary p{ color:#5a6b57; margin: 0 0 18px; }

  .het-choice{
    display:flex;
    gap:12px;
    margin-top: 22px;
  }
  .het-btn{
    flex:1;
    padding: 18px 10px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background:#fff;
    font-family:'Baloo 2', sans-serif;
    font-size: 22px;
    color: var(--sage-deep);
    cursor:pointer;
    transition: border-color .12s ease, background .12s ease;
  }
  .het-btn:hover{ border-color: var(--sage-mid); }
  .het-btn.correct{ background: #e5f2df; border-color: var(--sage-deep); }
  .het-btn.incorrect{ background: #f7e3dd; border-color: var(--error); }

  .word-display{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-size: 30px;
    color: var(--ink);
    margin: 6px 0 4px;
  }

  .flip-scene{
    perspective: 1200px;
    margin: 10px auto 6px;
    max-width: 320px;
  }
  .flip-card{
    position: relative;
    width: 100%;
    height: 220px;
    cursor: pointer;
  }
  .flip-card-inner{
    position:relative;
    width:100%; height:100%;
    text-align:center;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }
  .flip-card.flipped .flip-card-inner{
    transform: rotateY(180deg);
  }
  .flip-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius: 16px;
    border: 2px solid var(--line);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 10px;
    background: #fff;
  }
  .flip-face.front .emoji{ font-size: 72px; filter:none; }
  .flip-face.front .tap-hint{
    font-size: 12px;
    color: #8a9a86;
    font-weight:600;
  }
  .flip-face.back{
    transform: rotateY(180deg);
    background: var(--sage-deep);
    color: #fff;
  }
  .flip-face.back .word{
    font-family:'Baloo 2', sans-serif;
    font-size: 28px;
    font-weight:700;
  }
  .flip-face.back .article-tag{
    font-size: 12px;
    text-transform: none;
    background: rgba(255,255,255,0.18);
    padding: 3px 10px;
    border-radius: 999px;
    font-weight:600;
  }

  .card-nav{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-top: 18px;
    gap: 10px;
  }
  .card-nav .counter{
    font-size: 13px;
    color: #5a6b57;
    font-weight:600;
  }

  @media (prefers-reduced-motion: reduce){
    .flip-card-inner{ transition:none; }
  }

  footer.note{
    text-align:center;
    font-size: 12px;
    color: #7f8f7a;
    margin-top: 18px;
  }

  @media (prefers-reduced-motion: reduce){
    .btn{ transition:none; }
  }

  @media (max-width: 400px){
    form.answer-row{ flex-wrap: wrap; }
    form.answer-row input[type=text]{ flex-basis: 100%; }
    form.answer-row .btn-primary{ flex: 1; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="kicker">Vocabulaire · Néerlandais</div>
    <h1>Apprendre le néerlandais</h1>
    <p>Écris le mot néerlandais correct pour chaque animal, avec le bon article (de/het). Demande un indice si tu bloques — mais ça coûte des points.</p>
  </header>

  <nav class="tabs">
    <button id="tab-spell" class="active">Animaux</button>
    <button id="tab-het">Déterminant</button>
    <button id="tab-cards">Apprendre</button>
  </nav>

  <div class="card" id="card"></div>

  <footer class="note">Nikelquiz 1.0.1</footer>
</div>

<script>
const ANIMALS = [
  {emoji:"🐱", answer:"de kat"},
  {emoji:"🐶", answer:"de hond"},
  {emoji:"🐟", answer:"de vis"},
  {emoji:"🕷️", answer:"de spin"},
  {emoji:"🐺", answer:"de wolf"},
  {emoji:"🐔", answer:"de kip"},
  {emoji:"🐷", answer:"het varken"},
  {emoji:"🐰", answer:"het konijn"},
  {emoji:"🐴", answer:"het paard"},
  {emoji:"🐄", answer:"de koe"},
  {emoji:"🐭", answer:"de muis"},
  {emoji:"🐦", answer:"de vogel"},
  {emoji:"🦆", answer:"de eend"},
  {emoji:"🐑", answer:"het schaap"},
  {emoji:"🐢", answer:"de schildpad"},
  {emoji:"🐹", answer:"de cavia"},
  {emoji:"🦊", answer:"de vos"},
  {emoji:"🐐", answer:"de geit"},
];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// ---------- Section 1: spelling quiz ----------
const spellState = {
  order: shuffle(ANIMALS),
  index: 0,
  score: 0,
  revealed: new Set(),
  wrongAttempts: 0,
  finished: false,
};

function revealAnswer(answer, revealedSet){
  let out = "";
  for(let i = 0; i < answer.length; i++){
    const ch = answer[i];
    if(ch === " "){ out += "  "; continue; }
    out += revealedSet.has(i) ? ch : "_";
  }
  return out;
}

function renderSpell(){
  const card = document.getElementById('card');
  const st = spellState;

  if(st.finished){
    card.innerHTML = `
      <div class="summary">
        <div class="kicker">Terminé !</div>
        <div class="big">${st.score} points</div>
        <p>Tu as fait les ${st.order.length} animaux.</p>
        <button class="btn btn-primary" id="restart">Recommencer</button>
      </div>
    `;
    document.getElementById('restart').onclick = () => {
      spellState.order = shuffle(ANIMALS);
      spellState.index = 0;
      spellState.score = 0;
      spellState.revealed = new Set();
      spellState.wrongAttempts = 0;
      spellState.finished = false;
      renderSpell();
    };
    return;
  }

  const item = st.order[st.index];
  const nonSpaceLen = item.answer.replace(/ /g, '').length;
  const dots = st.order.map((_, i) => {
    let cls = 'dot';
    if(i < st.index) cls += ' done';
    if(i === st.index) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');

  card.innerHTML = `
    <div class="score-row">
      <span>Animal ${st.index + 1} / ${st.order.length}</span>
      <span class="score">${st.score} pts</span>
    </div>
    <div class="stage">
      <div class="emoji">${item.emoji}</div>
      <div class="hint-line" id="hintline">${st.revealed.size > 0 ? revealAnswer(item.answer, st.revealed) : '&nbsp;'}</div>
    </div>
    <form class="answer-row" id="answerForm" autocomplete="off">
      <input type="text" id="answerInput" placeholder="ex. de kat" />
      <button type="submit" class="btn btn-primary">Vérifier</button>
    </form>
    <div class="row-actions">
      <button class="btn btn-ghost" id="hintBtn" ${st.revealed.size >= nonSpaceLen ? 'disabled' : ''}>Indice (+1 lettre, −2 pts)</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="progress-dots">${dots}</div>
  `;

  const input = document.getElementById('answerInput');
  input.focus();

  document.getElementById('hintBtn').onclick = () => {
    const available = [];
    for(let i = 0; i < item.answer.length; i++){
      if(item.answer[i] !== ' ' && !st.revealed.has(i)) available.push(i);
    }
    if(available.length > 0){
      const pick = available[Math.floor(Math.random() * available.length)];
      st.revealed.add(pick);
    }
    renderSpell();
    document.getElementById('answerInput').focus();
  };

  document.getElementById('answerForm').onsubmit = (e) => {
    e.preventDefault();
    const val = input.value.trim().toLowerCase().replace(/\s+/g,' ');
    const correct = item.answer.toLowerCase();
    const feedback = document.getElementById('feedback');

    if(val === correct){
      input.classList.add('right');
      const pts = Math.max(10 - st.revealed.size * 2 - st.wrongAttempts, 2);
      st.score += pts;
      feedback.textContent = `Bien joué ! +${pts} points`;
      feedback.className = 'feedback good';
      input.disabled = true;
      document.getElementById('hintBtn').disabled = true;
      setTimeout(() => {
        st.index++;
        st.revealed = new Set();
        st.wrongAttempts = 0;
        if(st.index >= st.order.length){ st.finished = true; }
        renderSpell();
      }, 700);
    } else {
      input.classList.add('wrong');
      st.wrongAttempts++;
      feedback.textContent = 'Pas tout à fait — réessaie.';
      feedback.className = 'feedback bad';
      input.select();
    }
  };
}

// ---------- Section 2: de / het practice ----------
const hetWords = ANIMALS.map(a => {
  const [article, ...rest] = a.answer.split(' ');
  return { emoji: a.emoji, noun: rest.join(' '), article };
});

const hetState = {
  order: shuffle(hetWords),
  index: 0,
  score: 0,
  total: 0,
  finished: false,
};

function renderHet(){
  const card = document.getElementById('card');
  const st = hetState;

  if(st.finished){
    card.innerHTML = `
      <div class="summary">
        <div class="kicker">Terminé !</div>
        <div class="big">${st.score} / ${st.order.length * 5}</div>
        <p>Tu as fait les ${st.order.length} mots.</p>
        <button class="btn btn-primary" id="restartHet">Recommencer</button>
      </div>
    `;
    document.getElementById('restartHet').onclick = () => {
      hetState.order = shuffle(hetWords);
      hetState.index = 0;
      hetState.score = 0;
      hetState.finished = false;
      renderHet();
    };
    return;
  }

  const item = st.order[st.index];

  card.innerHTML = `
    <div class="score-row">
      <span>Mot ${st.index + 1} / ${st.order.length}</span>
      <span class="score">${st.score} pts</span>
    </div>
    <div class="stage">
      <div class="emoji">${item.emoji}</div>
      <div class="word-display">${item.noun}</div>
    </div>
    <div class="het-choice">
      <button class="het-btn" data-choice="de">de</button>
      <button class="het-btn" data-choice="het">het</button>
    </div>
    <div class="feedback" id="feedbackHet"></div>
  `;

  document.querySelectorAll('.het-btn').forEach(btn => {
    btn.onclick = () => {
      const choice = btn.dataset.choice;
      const feedback = document.getElementById('feedbackHet');
      document.querySelectorAll('.het-btn').forEach(b => b.disabled = true);

      if(choice === item.article){
        btn.classList.add('correct');
        st.score += 5;
        feedback.textContent = 'Correct !';
        feedback.className = 'feedback good';
      } else {
        btn.classList.add('incorrect');
        document.querySelector(`.het-btn[data-choice="${item.article}"]`).classList.add('correct');
        feedback.textContent = `Pas correct — c'est « ${item.article} ${item.noun} ».`;
        feedback.className = 'feedback bad';
      }

      setTimeout(() => {
        st.index++;
        if(st.index >= st.order.length){ st.finished = true; }
        renderHet();
      }, 900);
    };
  });
}

// ---------- Section 3: flip cards ----------
const cardsState = {
  order: shuffle(ANIMALS),
  index: 0,
  flipped: false,
};

function renderCards(){
  const card = document.getElementById('card');
  const st = cardsState;
  const item = st.order[st.index];
  const [article, ...rest] = item.answer.split(' ');
  const noun = rest.join(' ');

  card.innerHTML = `
    <div class="score-row">
      <span>Carte ${st.index + 1} / ${st.order.length}</span>
      <span></span>
    </div>
    <div class="flip-scene">
      <div class="flip-card ${st.flipped ? 'flipped' : ''}" id="flipCard">
        <div class="flip-card-inner">
          <div class="flip-face front">
            <div class="emoji">${item.emoji}</div>
            <div class="tap-hint">Touche la carte pour voir la réponse</div>
          </div>
          <div class="flip-face back">
            <span class="article-tag">${article}</span>
            <div class="word">${noun}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-nav">
      <button class="btn btn-ghost" id="prevCard">Précédent</button>
      <button class="btn btn-primary" id="nextCard">Suivant</button>
    </div>
  `;

  document.getElementById('flipCard').onclick = () => {
    st.flipped = !st.flipped;
    renderCards();
  };
  document.getElementById('prevCard').onclick = () => {
    st.index = (st.index - 1 + st.order.length) % st.order.length;
    st.flipped = false;
    renderCards();
  };
  document.getElementById('nextCard').onclick = () => {
    st.index = (st.index + 1) % st.order.length;
    st.flipped = false;
    renderCards();
  };
}

// ---------- Tabs ----------
const tabSpell = document.getElementById('tab-spell');
const tabHet = document.getElementById('tab-het');
const tabCards = document.getElementById('tab-cards');

function setActiveTab(tab){
  [tabSpell, tabHet, tabCards].forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
}

tabSpell.onclick = () => { setActiveTab(tabSpell); renderSpell(); };
tabHet.onclick = () => { setActiveTab(tabHet); renderHet(); };
tabCards.onclick = () => {
  setActiveTab(tabCards);
  cardsState.order = shuffle(ANIMALS);
  cardsState.index = 0;
  cardsState.flipped = false;
  renderCards();
};

renderSpell();
</script>
</body>
</html>
